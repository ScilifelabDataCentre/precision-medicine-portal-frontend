# Validate the Renovate configuration in .github/renovate.jsonc
# Adjust the paths to your own config files as needed, both in paths: and in run: below.
---
name: Validate Renovate config

on:
  pull_request:
    paths:
      - '.github/workflows/renovate-validate.yml'
      - '.github/renovate.jsonc' # Replace with your own config path, incl. in run below

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # We don't need the token in subsequent steps
      
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate preset
        # Pin 43 to match instance, but not exact version
        # --yes to automatically install renovate-config-validator if not present
        # --no-global because we are validating a shared config preset (not true when validating a repo config)
        # --strict to fail if scanned config needs migration
        run: |
          npx --yes --package renovate@43 -- renovate-config-validator --no-global --strict \
            .github/renovate.jsonc
